<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sparkle Resin Art | Contact</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0A0A0A; font-family: 'Inter', sans-serif; color: #ece7e1; }
    :root { --gold: #D4AF37; --card-bg: #141414; }
    .container { max-width: 1000px; margin: 0 auto; padding: 0 28px; }
    .brand-header { text-align: center; padding: 40px 0 20px; border-bottom: 2px solid rgba(212,175,55,0.3); }
    .brand-name { font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; font-weight: 700; color: var(--gold); text-transform: uppercase; }
    nav { display: flex; justify-content: center; gap: 3rem; padding: 24px 0; flex-wrap: wrap; border-bottom: 1px solid rgba(212,175,55,0.2); }
    nav a { text-decoration: none; color: #ece7e1; font-weight: 500; transition: 0.3s; }
    nav a:hover { color: var(--gold); }
    .contact-grid { display: flex; flex-wrap: wrap; gap: 40px; margin: 50px 0; }
    .contact-info { flex: 1; background: var(--card-bg); padding: 35px; border-radius: 32px; }
    .contact-form { flex: 1; background: var(--card-bg); padding: 35px; border-radius: 32px; }
    input, textarea { width: 100%; background: #1e1c19; border: 1px solid #3a352e; padding: 14px; border-radius: 30px; color: #fff; margin-bottom: 15px; }
    .btn-send { background: var(--gold); color: #0A0A0A; padding: 14px; border-radius: 40px; font-weight: bold; cursor: pointer; width: 100%; border: none; }
    .social-icon { font-size: 2rem; margin-right: 20px; color: var(--gold); }
    footer { text-align: center; padding: 40px 0; border-top: 1px solid rgba(212,175,55,0.2); margin-top: 50px; }
  </style>
</head>
<body>
<div class="container">
  <div class="brand-header">
    <div class="brand-name">SPARKLE RESIN ART BY AMATULLAH</div>
  </div>
  <nav>
    <a href="index.html">Home</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="order.html">Custom Order</a>
    <a href="reviews.html">Reviews</a>
    <a href="contact.html">Contact</a>
  </nav>

  <div class="contact-grid">
    <div class="contact-info">
      <h2 style="margin-bottom: 25px;">📞 Get in Touch</h2>
      <p><i class="fab fa-instagram social-icon"></i> <strong>@sparkle_resin_art_by_amatullah</strong></p>
      <p><i class="fas fa-map-marker-alt" style="color: var(--gold); margin-right: 15px;"></i> Porbandar, Gujarat — India</p>
      <p><i class="fas fa-clock" style="color: var(--gold); margin-right: 15px;"></i> Response within 24 hours</p>
      <p><i class="fas fa-shipping-fast" style="color: var(--gold); margin-right: 15px;"></i> Shipping across India & International</p>
      <div style="margin-top: 30px;">
        <button class="btn-send" onclick="window.open('https://instagram.com/sparkle_resin_art_by_amatullah', '_blank')">DM on Instagram →</button>
      </div>
    </div>
    <div class="contact-form">
      <h2 style="margin-bottom: 25px;">✉️ Send a Message</h2>
      <form id="contactForm">
        <input type="text" id="contactName" placeholder="Your Name" required>
        <input type="email" id="contactEmail" placeholder="Your Email" required>
        <textarea rows="4" id="contactMsg" placeholder="Tell me about your resin art idea..."></textarea>
        <button type="submit" class="btn-send">Send Message ✨</button>
        <div id="contactMsgDiv" style="margin-top: 15px; text-align: center;"></div>
      </form>
    </div>
  </div>

  <footer>
    <p>✨ Handcrafted with love in Porbandar ✨</p>
  </footer>
</div>
<script>
  document.getElementById('contactForm')?.addEventListener('submit', (e) => {
    e.preventDefault();
    document.getElementById('contactMsgDiv').innerHTML = '<div style="color:#D4AF37;">💌 Message sent! Amatullah will reply soon.</div>';
    e.target.reset();
  });
</script>
</body>
</html>
