<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sparkle Resin | Custom Order</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0A0A0A; font-family: 'Inter', sans-serif; color: #FFFFFF; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 60px; }
    
    nav { display: flex; justify-content: space-between; align-items: center; padding: 35px 0; flex-wrap: wrap; }
    .logo { font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; font-weight: 600; letter-spacing: 2px; color: #D4AF37; text-decoration: none; }
    .nav-links { display: flex; gap: 2.5rem; list-style: none; }
    .nav-links a { text-decoration: none; color: #FFFFFF; font-weight: 400; font-size: 0.9rem; transition: 0.2s; }
    .nav-links a:hover { color: #D4AF37; }
    
    .form-section { max-width: 800px; margin: 60px auto; }
    .form-section h1 { font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; font-weight: 500; text-align: center; margin-bottom: 15px; color: #FFFFFF; }
    .form-section p { text-align: center; color: #CCCCCC; margin-bottom: 40px; }
    
    input, textarea, select { width: 100%; background: #141414; border: 1px solid #222; padding: 14px 18px; border-radius: 8px; margin-bottom: 20px; font-family: 'Inter', sans-serif; color: #FFFFFF; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: #D4AF37; }
    .upload-area { border: 1px dashed #D4AF37; background: #141414; border-radius: 8px; padding: 25px; text-align: center; cursor: pointer; margin-bottom: 20px; }
    .btn-submit { background: #D4AF37; border: none; color: #0A0A0A; padding: 14px; width: 100%; font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: 0.3s; border-radius: 8px; font-weight: 600; }
    .btn-submit:hover { background: #E8D174; }
    .whatsapp-btn { background: #25D366; border: none; color: white; padding: 14px; width: 100%; font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: 0.3s; border-radius: 8px; font-weight: 600; margin-top: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .whatsapp-btn:hover { background: #128C7E; }
    
    footer { border-top: 1px solid #222; text-align: center; padding: 40px 0; margin-top: 60px; color: #666; font-size: 0.8rem; }
    
    @media (max-width: 900px) { .container { padding: 0 25px; } .nav-links { gap: 1.2rem; margin-top: 15px; } }
  </style>
</head>
<body>

<div class="container">
  <nav>
    <a href="index.html" class="logo">SPARKLE RESIN</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="office.html">Office</a></li>
      <li><a href="order.html">Custom Order</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <div class="form-section">
    <h1>Custom Order</h1>
    <p>Fill out the form below, then click WhatsApp to send your order directly to me</p>
    
    <form id="customOrderForm">
      <input type="text" id="name" placeholder="Full Name *" required>
      <input type="text" id="phone" placeholder="Your WhatsApp Number (optional)">
      <select id="category" required>
        <option value="">Select Product Type</option>
        <option>Tray</option>
        <option>Wall Art</option>
        <option>Clock</option>
        <option>Name Plate</option>
        <option>Keychain</option>
        <option>Phone Case</option>
        <option>Photo Frame</option>
        <option>Other</option>
      </select>
      <textarea rows="4" id="details" placeholder="Describe your idea — colors, size, budget, special elements..." required></textarea>
      <div class="upload-area" id="uploadTrigger">
        <i class="fas fa-cloud-upload-alt"></i> Click to upload reference photo (will be sent separately)
        <input type="file" id="photoRef" accept="image/*" style="display: none;">
      </div>
      
      <!-- WhatsApp Send Button -->
      <button type="button" class="whatsapp-btn" id="sendToWhatsApp">
        <i class="fab fa-whatsapp"></i> Send Order on WhatsApp →
      </button>
      
      <div id="formMessage" style="margin-top: 15px; text-align: center;"></div>
    </form>
  </div>

  <footer>
    <p>© 2025 Sparkle Resin — Handcrafted with Love in Porbandar</p>
  </footer>
</div>

<script>
  // File upload visual feedback
  const uploadTrigger = document.getElementById('uploadTrigger');
  const fileInput = document.getElementById('photoRef');
  if(uploadTrigger) {
    uploadTrigger.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', function() {
      if(this.files.length) {
        uploadTrigger.innerHTML = '<i class="fas fa-check-circle"></i> ' + this.files[0].name + ' selected';
      }
    });
  }

  // WhatsApp send function
  const sendToWhatsApp = document.getElementById('sendToWhatsApp');
  
  sendToWhatsApp.addEventListener('click', function() {
    // Get form values
    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const category = document.getElementById('category').value;
    const details = document.getElementById('details').value.trim();
    const photoFile = fileInput.files[0];
    
    // Validate required fields
    if(!name) {
      document.getElementById('formMessage').innerHTML = '<div style="color:#E0BFB3;">⚠️ Please enter your name</div>';
      return;
    }
    if(!category) {
      document.getElementById('formMessage').innerHTML = '<div style="color:#E0BFB3;">⚠️ Please select a product type</div>';
      return;
    }
    if(!details) {
      document.getElementById('formMessage').innerHTML = '<div style="color:#E0BFB3;">⚠️ Please describe your idea</div>';
      return;
    }
    
    // Build WhatsApp message
    let whatsappMessage = "🟡 *NEW CUSTOM ORDER* 🟡%0A";
    whatsappMessage += "%0A";
    whatsappMessage += "*Customer Name:* " + name + "%0A";
    if(phone) whatsappMessage += "*Customer WhatsApp:* " + phone + "%0A";
    whatsappMessage += "*Product Type:* " + category + "%0A";
    whatsappMessage += "*Order Details:* %0A" + details + "%0A";
    whatsappMessage += "%0A";
    whatsappMessage += "📸 *Photo Reference:* " + (photoFile ? "Customer will send photo separately" : "No photo attached") + "%0A";
    whatsappMessage += "%0A";
    whatsappMessage += "_Sent from Sparkle Resin Website_";
    
    // Your WhatsApp number (international format without + or spaces)
    const whatsappNumber = "918488953611";  // +91 84889 53611 -> 918488953611
    
    // Create WhatsApp URL
    const whatsappUrl = `https://wa.me/${whatsappNumber}?text=${whatsappMessage}`;
    
    // Show confirmation before redirecting
    document.getElementById('formMessage').innerHTML = '<div style="color:#D4AF37;">✨ Opening WhatsApp... Please send the message ✨</div>';
    
    // Open WhatsApp
    window.open(whatsappUrl, '_blank');
    
    // Optional: Also tell user about photo
    if(photoFile) {
      setTimeout(() => {
        document.getElementById('formMessage').innerHTML = '<div style="color:#D4AF37;">📸 Don\'t forget to send your reference photo separately on WhatsApp! ✨</div>';
      }, 2000);
    }
    
    // Reset message after 5 seconds
    setTimeout(() => {
      if(document.getElementById('formMessage').innerHTML.includes('WhatsApp')) {
        document.getElementById('formMessage').innerHTML = '';
      }
    }, 8000);
  });
</script>
</body>
</html>
